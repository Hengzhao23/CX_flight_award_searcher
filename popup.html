<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; margin: 12px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  input, select, button { font: inherit; padding: 4px; }
  form button, .wide { grid-column: span 2; }
  td a { color: inherit; }
  th { text-align: left; vertical-align: bottom; border-bottom: 1px solid #ccc; padding: 3px 6px; }
  .n { color: #0a7d32; font-weight: 600; }
  #job { margin-top: 14px; border-top: 2px solid #005d63; padding-top: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  td { padding: 3px 6px; border-bottom: 1px solid #eee; }
  .H { color: #0a7d32; font-weight: 600; } .L { color: #b36b00; font-weight: 600; } .NA { color: #999; }
  #msg { margin-top: 8px; color: #555; }
</style>
<form id="f">
  <input id="from" class="wide" list="airports" placeholder="From: city, airport or code" required value="HKG" autocomplete="off">
  <input id="to" class="wide" list="airports" placeholder="To: city, airport or code" required autocomplete="off">
  <datalist id="airports"></datalist>
  <select id="cabin">
    <option value="any">Any cabin</option><option value="eco">Economy</option><option value="pey">Premium Economy</option>
    <option value="bus" selected>Business</option><option value="fir">First</option>
  </select>
  <label><input type="checkbox" id="onlyAvail" checked> Available only</label>
  <input type="date" id="start" required><input type="date" id="end" required>
  <button>Quick check (calendar)</button>
  <button type="button" id="full">Full search on Cathay (sign-in)</button>
</form>
<div id="msg"></div>
<table id="out"></table>
<div id="job" hidden>
  <b id="jobtitle"></b> <button type="button" id="stop">Stop</button>
  <div id="jobmsg"></div>
  <table id="jobout"><thead><tr><th>Date</th><th>Flight</th><th>Route</th><th>Departs</th><th>First (F)</th><th>Business (J)</th><th>Premium Economy (PY)</th><th>Economy (Y)</th></tr></thead><tbody></tbody></table>
</div>
<script src="popup.js"></script>
